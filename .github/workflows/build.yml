name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Verify generated project
        run: |
          ls -la
          xcodebuild -list -project BYDLock.xcodeproj

      - name: Build (unsigned, arm64)
        run: |
          set -o pipefail
          xcodebuild \
            -project BYDLock.xcodeproj \
            -scheme BYDLock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log | tail -60

      - name: Find app bundle
        id: findapp
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "App not found"; exit 1; fi
          echo "Found: $APP"
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          # 记录最小系统版本，确认 iOS16 可装
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          lipo -archs "$APP/BYDLock" || true

      - name: Package IPA
        run: |
          rm -rf Payload BYDLock.ipa
          mkdir -p Payload
          cp -R "${{ steps.findapp.outputs.app_path }}" Payload/
          zip -qry BYDLock.ipa Payload
          ls -lh BYDLock.ipa
          echo "---- ipa 内容 ----"
          unzip -l BYDLock.ipa | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYDLock-unsigned-ipa
          path: BYDLock.ipa
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
